name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMUNIQUE_MODEL: ${{ vars.COMMUNIQUE_MODEL }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: mise run release-notes "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: .robin/releases/*.md
          if-no-files-found: error

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run release-build
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: .robin/releases/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [notes, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish notes and all three CLI archives
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 3
          sha256sum *.tar.gz > SHA256SUMS
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_TAG.md" "${options[@]}" *.tar.gz SHA256SUMS
